<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雾都1937 · 重庆：一座城的生存博弈</title>
  <style>
    /* ========== 外壳页：背景音乐常驻，所有内容在 iframe 内切换，音乐不中断 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Noto Serif SC', 'SimSun', serif;
    }

    /* 内容舞台：所有页面在此切换，音频元素留在外壳，不受页面跳转影响 */
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f2e8cf;
    }

    /* 音乐开关（固定在左下角，避开内容页右下角的浮动导航按钮） */
    #bgm-toggle {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 99998;
      padding: 10px 20px;
      background: rgba(43, 36, 24, 0.88);
      color: #f2e8cf;
      border: 1px solid rgba(242, 232, 207, 0.35);
      font-family: 'Noto Serif SC', 'SimSun', serif;
      font-size: 13px;
      letter-spacing: 0.15em;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      transition: background 0.3s, transform 0.2s;
      user-select: none;
    }
    #bgm-toggle:hover { background: #8b2e2e; transform: translateY(-2px); }
    #bgm-toggle.playing { border-color: rgba(242, 232, 207, 0.6); }

    /* ========== 启动门：浏览器拦截自动播放时，点击一次即可开启音乐并进入 ========== */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(26,26,26,0.55) 0%, rgba(45,42,36,0.6) 50%, rgba(61,56,48,0.8) 100%),
        url('assets/images/hero-bg.jpg') center/cover no-repeat, #1a1a1a;
      color: #f2e8cf;
      cursor: pointer;
      transition: opacity 1.2s ease;
    }
    #gate.hidden { opacity: 0; pointer-events: none; }
    #gate[hidden] { display: none; }

    #gate .fog-layer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 800px 200px at 20% 60%, rgba(200,200,190,0.15), transparent),
        radial-gradient(ellipse 600px 150px at 70% 40%, rgba(200,200,190,0.12), transparent),
        radial-gradient(ellipse 1000px 300px at 50% 80%, rgba(200,200,190,0.1), transparent);
      animation: gateFogDrift 20s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes gateFogDrift {
      0% { transform: translateX(-50px); opacity: 0.8; }
      100% { transform: translateX(50px); opacity: 1; }
    }

    #gate .gate-title {
      font-family: 'Ma Shan Zheng', 'Noto Serif SC', 'SimSun', cursive;
      font-size: 96px;
      letter-spacing: 0.2em;
      text-shadow: 0 0 40px rgba(242, 232, 207, 0.3);
      z-index: 2;
      animation: gateFadeUp 1.6s ease 0.2s both;
    }
    #gate .gate-line {
      width: 200px;
      height: 1px;
      background: rgba(242, 232, 207, 0.3);
      margin: 36px 0;
      z-index: 2;
      animation: gateFade 1.6s ease 0.8s both;
    }
    #gate .gate-subtitle {
      font-size: 18px;
      letter-spacing: 0.5em;
      color: rgba(242, 232, 207, 0.7);
      z-index: 2;
      animation: gateFadeUp 1.6s ease 0.6s both;
    }
    #gate .gate-btn {
      margin-top: 56px;
      padding: 16px 60px;
      background: transparent;
      border: 1px solid rgba(242, 232, 207, 0.5);
      color: #f2e8cf;
      font-family: 'Noto Serif SC', 'SimSun', serif;
      font-size: 18px;
      letter-spacing: 0.3em;
      cursor: pointer;
      z-index: 2;
      transition: all 0.3s;
      animation: gateFadeUp 1.6s ease 1.1s both;
    }
    #gate:hover .gate-btn { background: #f2e8cf; color: #2b2418; border-color: #f2e8cf; }
    #gate .gate-tip {
      margin-top: 22px;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: rgba(242, 232, 207, 0.45);
      z-index: 2;
      animation: gateFade 1.6s ease 1.4s both;
    }
    @keyframes gateFadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gateFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ========== 视觉小说对话框（常驻外壳层，保证跨页面稳定显示） ========== */
    #vn-dialogue {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(18,14,10,0.97), rgba(20,15,10,0.9));
      padding: 22px 32px 26px;
      z-index: 999990;
      display: none;
      gap: 24px;
      align-items: flex-end;
      color: #f2e8cf;
      font-family: 'Noto Serif SC', 'SimSun', serif;
      backdrop-filter: blur(6px);
      border-top: 1px solid rgba(232,200,150,0.25);
      transform: translateY(105%);
      transition: transform 0.5s ease;
      cursor: pointer;
      max-height: 46vh;
    }
    #vn-dialogue.show {
      display: flex;
      transform: translateY(0);
    }
    #vn-dialogue.vn-mono {
      background: linear-gradient(to top, rgba(20,24,22,0.97), rgba(18,22,20,0.9));
      border-top-color: rgba(150,180,160,0.3);
    }
    #vn-dialogue .vn-char-img {
      width: 104px; height: 104px;
      border-radius: 6px;
      background: #2b2418;
      flex-shrink: 0;
      border: 2px solid rgba(242,232,207,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 46px;
      overflow: hidden;
    }
    #vn-dialogue .vn-char-img img {
      width: 100%; height: 100%; object-fit: cover;
      filter: sepia(0.25);
    }
    #vn-dialogue .vn-body { flex: 1; min-width: 0; }
    #vn-dialogue .vn-head {
      display: flex; align-items: center; gap: 12px;
    }
    #vn-dialogue .vn-char-name {
      font-family: 'Ma Shan Zheng', 'Noto Serif SC', cursive;
      font-size: 23px;
      color: #e8c896;
    }
    #vn-dialogue.vn-mono .vn-char-name { color: #9ec4ad; }
    #vn-dialogue .vn-tag {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(242,232,207,0.5);
      border: 1px solid rgba(242,232,207,0.3);
      padding: 2px 8px;
    }
    #vn-dialogue .vn-text {
      color: #f2e8cf;
      font-size: 17px;
      line-height: 2;
      min-height: 68px;
      letter-spacing: 0.04em;
      margin-top: 6px;
    }
    #vn-dialogue .vn-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    #vn-dialogue .vn-continue {
      color: rgba(242,232,207,0.4);
      font-size: 12px;
      animation: vnBlink 1.4s ease-in-out infinite;
    }
    @keyframes vnBlink { 50% { opacity: 0.3; } }
    #vn-dialogue .vn-voice-toggle {
      background: transparent;
      border: 1px solid rgba(242,232,207,0.3);
      color: rgba(242,232,207,0.75);
      font-family: 'Noto Serif SC', 'SimSun', serif;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      letter-spacing: 0.1em;
    }
    #vn-dialogue .vn-voice-toggle:hover { background: rgba(242,232,207,0.15); }

    /* 常驻浮动导航（外壳层，保证稳定显示） */
    #float-nav {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 99998;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    #float-nav[hidden] { display: none; }
    #float-nav .fn-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #float-nav.open .fn-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #float-nav button {
      font-family: 'Noto Serif SC', 'SimSun', serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--paper, #f2e8cf);
      background: rgba(30,24,16,0.82);
      border: 1px solid rgba(232,200,150,0.35);
      padding: 9px 16px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
      white-space: nowrap;
    }
    #float-nav button:hover { background: rgba(90,66,40,0.92); }
    #float-nav #fn-toggle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <!-- 内容舞台：各页面在此切换，跳转不重新加载外壳 -->
  <iframe id="stage" title="雾都1937" src="about:blank"></iframe>

  <!-- 背景音乐（常驻，仅此外壳持有一份，循环播放） -->
  <audio id="bgm" src="assets/audio/war-bgm.mp3" loop preload="auto"></audio>

  <!-- 音乐开关 -->
  <button id="bgm-toggle" type="button" title="播放 / 暂停背景音乐">🎵 音乐</button>

  <!-- 启动门：仅在浏览器拦截自动播放时出现 -->
  <div id="gate" hidden>
    <div class="fog-layer"></div>
    <h1 class="gate-title">雾都1937</h1>
    <div class="gate-line"></div>
    <p class="gate-subtitle">重 庆 · 一 座 城 的 生 存 博 弈</p>
    <button class="gate-btn" type="button">点 击 进 入</button>
    <p class="gate-tip">点击进入后，背景音乐将伴随你走过整座雾都，切换页面不会中断</p>
  </div>

  <!-- 视觉小说对话框（常驻外壳，由内容页通过 postMessage 驱动） -->
  <div id="vn-dialogue" hidden>
    <div class="vn-char-img" id="vn-img"></div>
    <div class="vn-body">
      <div class="vn-head">
        <span class="vn-char-name" id="vn-name"></span>
        <span class="vn-tag" id="vn-tag" style="display:none;"></span>
      </div>
      <div class="vn-text" id="vn-text"></div>
      <div class="vn-hint">
        <button class="vn-voice-toggle" id="vn-voice" type="button" title="开关语音朗读">🔊 朗读</button>
        <span class="vn-continue">点击继续 ▼</span>
      </div>
    </div>
  </div>

  <!-- 常驻浮动导航（外壳层） -->
  <div id="float-nav" hidden>
    <div class="fn-menu" id="fn-menu">
      <button type="button" id="fn-home">🗺️ 返回城厢图</button>
      <button type="button" id="fn-reselect">🔄 重新开始</button>
    </div>
    <button type="button" id="fn-toggle" title="菜单">☰</button>
  </div>

  <!-- 地图行走过场：切换到下一幕时，小人从当前地点走到下一个地点 -->
  <div id="walk-overlay">
    <div id="walk-caption"></div>
    <svg id="walk-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="walk-clip"><circle cx="0" cy="0" r="20"/></clipPath>
      </defs>
      <path d="M0 550 Q250 520 520 555 T1000 545 L1000 700 L0 700 Z" fill="#b8c4c8" opacity="0.4"/>
      <path d="M0 200 Q180 255 330 235 Q430 300 460 360 L360 380 Q180 360 0 395 Z" fill="#b8c4c8" opacity="0.4"/>
      <path d="M450 350 Q500 280 600 260 Q750 240 850 300 Q900 400 850 500 Q750 580 600 570 Q500 550 450 480 Z"
            fill="#d4c9a8" opacity="0.45" stroke="#8a7d5a" stroke-width="1.5"/>
      <g id="walk-dots"></g>
      <path id="walk-path" fill="none" stroke="#8b2e2e" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <g id="walk-mover">
        <circle r="23" fill="#f2e8cf" stroke="#8b2e2e" stroke-width="3"/>
        <image id="walk-mover-img" href="" x="-20" y="-20" width="40" height="40"
               preserveAspectRatio="xMidYMid slice" clip-path="url(#walk-clip)"/>
      </g>
    </svg>
  </div>

  <style>
    #walk-overlay {
      position: fixed; inset: 0; z-index: 99998;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #efe4c8 0%, #d3c39e 100%);
      opacity: 0; transition: opacity .45s;
    }
    #walk-caption {
      font-family: 'Ma Shan Zheng', cursive; font-size: 32px; color: #33281a;
      letter-spacing: 0.04em; margin-bottom: 4px; text-align: center;
      padding: 0 20px;
    }
    #walk-svg { width: 94vw; max-width: 1080px; height: auto; }
  </style>
  <script>
  (function () {
    'use strict';

    var stage = document.getElementById('stage');
    var bgm = document.getElementById('bgm');
    var gate = document.getElementById('gate');
    var toggle = document.getElementById('bgm-toggle');

    var OFF_KEY = 'wudu1937_bgm_off';    // 用户是否主动关闭音乐
    var TIME_KEY = 'wudu1937_bgm_time';  // 刷新前的播放进度（秒）

    /* ---------- 路由：hash 决定 iframe 加载哪个页面 ---------- */
    function validRel(hash) {
      var h = decodeURIComponent(String(hash || '').replace(/^#/, ''));
      if (/^(index\.html|pages\/[A-Za-z0-9_\-\/]+\.html)$/.test(h)) return h;
      return null;
    }
    function currentRel() {
      return validRel(location.hash) || 'index.html';
    }

    stage.src = currentRel();

    // 浏览器前进/后退：同步 iframe
    window.addEventListener('hashchange', function () {
      var rel = currentRel();
      if (stage.getAttribute('src') !== rel) stage.src = rel;
    });

    // 内容页加载完成后通知外壳当前路径，同步地址栏（刷新后可回到当前页）
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.__wudu1937 === 'nav' && d.rel && validRel('#' + d.rel)) {
        if ('#' + d.rel !== location.hash) {
          history.replaceState(null, '', '#' + d.rel);
        }
      }
    });

    /* ---------- 背景音乐 ---------- */
    bgm.volume = 0.4;

    // 恢复上次播放位置（刷新后续播，而不是从头开始）
    var savedTime = parseFloat(sessionStorage.getItem(TIME_KEY) || '0');
    if (savedTime > 0) {
      bgm.addEventListener('loadedmetadata', function () {
        try { if (isFinite(savedTime) && savedTime < bgm.duration) bgm.currentTime = savedTime; } catch (e) {}
      });
    }
    // 每 2 秒记录一次播放进度
    setInterval(function () {
      if (!bgm.paused && !bgm.ended && isFinite(bgm.currentTime)) {
        sessionStorage.setItem(TIME_KEY, String(bgm.currentTime));
      }
    }, 2000);

    var userOff = localStorage.getItem(OFF_KEY) === '1';
    var userEntered = false;  // 用户是否已通过点击进入（顶层已获得用户手势）
    var gateToken = 0;        // 防止显示/隐藏动画的延时回调互相覆盖

    function syncToggle() {
      var playing = !bgm.paused;
      toggle.textContent = playing ? '🎵 音乐' : '🔇 音乐';
      toggle.classList.toggle('playing', playing);
    }

    function showGate() {
      if (userEntered || userOff) return;
      gateToken++;
      gate.hidden = false;
      requestAnimationFrame(function () { gate.classList.remove('hidden'); });
    }
    function hideGate() {
      if (gate.hidden) return;
      var token = gateToken;
      gate.classList.add('hidden');
      setTimeout(function () {
        if (token === gateToken) gate.hidden = true;
      }, 1300);
    }

    // 进入页面即尝试播放；浏览器允许自动播放时全程无感
    if (!userOff) {
      var p = bgm.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {
          if (!bgm.paused) hideGate();
        }).catch(function () { showGate(); });
      }
    }

    // 自动播放后若被浏览器策略暂停（且用户尚未点击进入），重新提示点击
    bgm.addEventListener('pause', function () {
      syncToggle();
      if (!userOff && !userEntered) showGate();
    });
    bgm.addEventListener('play', syncToggle);

    // 自动播放被拦截时，点击启动门（顶层用户手势）后播放
    gate.addEventListener('click', function () {
      userEntered = true;
      if (!userOff) {
        bgm.play().catch(function () {});
      }
      hideGate();
    });

    // 音乐开关
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      userEntered = true;
      if (bgm.paused) {
        userOff = false;
        localStorage.removeItem(OFF_KEY);
        bgm.play().catch(function () {});
      } else {
        bgm.pause();
        userOff = true;
        localStorage.setItem(OFF_KEY, '1');
      }
    });

    syncToggle();
  })();

  /* ========== 视觉小说对话引擎（常驻外壳层） ========== */
  (function () {
    'use strict';
    var box = document.getElementById('vn-dialogue');
    var elImg = document.getElementById('vn-img');
    var elName = document.getElementById('vn-name');
    var elTag = document.getElementById('vn-tag');
    var elText = document.getElementById('vn-text');
    var elVoice = document.getElementById('vn-voice');
    var stage = document.getElementById('stage');
    var bgm = document.getElementById('bgm');

    var lines = [];
    var idx = 0;
    var typing = false;
    var typeTimer = null;
    var curVoice = null;
    var voiceOn = true;
    var femaleVoice = null;
    var maleVoice = null;
    var open = false;
    var BGM_BASE = 0.4, BGM_DUCK = 0.14;

    try { voiceOn = localStorage.getItem('wudu1937_voice') !== '0'; } catch (e) {}

    function pickVoice() {
      if (!('speechSynthesis' in window)) return;
      var vs = window.speechSynthesis.getVoices();
      var zh = vs.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('zh') === 0; });
      femaleVoice =
        zh.find(function (v) { return /hui|yaoyao|xiaoxiao|female|tingting/i.test(v.name); }) ||
        zh.find(function (v) { return v.lang === 'zh-CN'; }) || zh[0] || null;
      maleVoice =
        zh.find(function (v) { return /kangkang|male|yunjian|yunxi/i.test(v.name); }) ||
        femaleVoice;
    }
    if ('speechSynthesis' in window) {
      pickVoice();
      window.speechSynthesis.onvoiceschanged = pickVoice;
    }

    function syncVoiceBtn() {
      elVoice.textContent = voiceOn ? '🔊 朗读' : '🔇 静音';
    }
    syncVoiceBtn();

    function speak(text, voice) {
      if (!voiceOn || !('speechSynthesis' in window) || !text) return;
      try {
        var synth = window.speechSynthesis;
        synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        var pitch = (voice && voice.pitch) || 1;
        // pitch < 0.95 视为男性角色，用男声；其余用女声
        var chosen = pitch < 0.95 ? maleVoice : femaleVoice;
        if (chosen) u.voice = chosen;
        u.pitch = pitch;
        u.rate = (voice && voice.rate) || 0.92;
        u.volume = 1;
        synth.speak(u);
      } catch (e) {}
    }
    function stopSpeak() {
      if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    }
    function duck(on) {
      if (!bgm) return;
      bgm.volume = on ? BGM_DUCK : BGM_BASE;
    }

    function renderImg(img) {
      if (img && /\.(jpg|jpeg|png|webp)$/i.test(img)) {
        // 内容页发来的头像统一相对外壳根目录
        var src = img.indexOf('assets/') === 0 ? img : ('assets/images/' + img.replace(/^.*[\\/]/, ''));
        elImg.innerHTML = '<img src="' + src + '" alt="">';
      } else {
        elImg.innerHTML = '<span>' + (img || '👤') + '</span>';
      }
    }

    function showLine() {
      if (idx >= lines.length) { closeBox(true); return; }
      var line = lines[idx];
      elText.textContent = '';
      typing = true;
      var i = 0;
      speak(line, curVoice);
      clearInterval(typeTimer);
      typeTimer = setInterval(function () {
        if (i < line.length) {
          elText.textContent += line.charAt(i);
          i++;
        } else {
          clearInterval(typeTimer);
          typing = false;
        }
      }, 42);
    }

    function openDialogue(d) {
      open = true;
      lines = d.lines || [];
      idx = 0;
      curVoice = d.voice || null;
      box.classList.toggle('vn-mono', !!d.mono);
      elName.textContent = d.name || '';
      if (d.tag) { elTag.textContent = d.tag; elTag.style.display = ''; }
      else { elTag.style.display = 'none'; }
      renderImg(d.img);
      box.hidden = false;
      requestAnimationFrame(function () { box.classList.add('show'); });
      duck(true);
      showLine();
    }

    function closeBox(notify) {
      if (!open) return;
      open = false;
      clearInterval(typeTimer);
      stopSpeak();
      duck(false);
      box.classList.remove('show');
      box.hidden = true;
      if (notify) {
        try { stage.contentWindow.postMessage({ __wudu1937: 'dialogueDone' }, '*'); } catch (e) {}
      }
    }

    // 点击推进：打字中→立即补全；已完成→下一句
    box.addEventListener('click', function (e) {
      if (e.target === elVoice) return;
      if (typing) {
        clearInterval(typeTimer);
        elText.textContent = lines[idx];
        typing = false;
      } else {
        idx++;
        showLine();
      }
    });
    elVoice.addEventListener('click', function (e) {
      e.stopPropagation();
      voiceOn = !voiceOn;
      try { localStorage.setItem('wudu1937_voice', voiceOn ? '1' : '0'); } catch (err) {}
      if (!voiceOn) stopSpeak();
      else speak(lines[idx], curVoice);
      syncVoiceBtn();
    });

    // 内容页 → 外壳
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.__wudu1937 !== 'dialogue') return;
      if (d.action === 'close') { closeBox(false); return; }
      openDialogue(d);
    });

    // 切换内容页时关闭对话框（不触发完成回调，新页面有自己的流程）
    stage.addEventListener('load', function () {
      if (open) closeBox(false);
      updateFloatNav();
    });

    /* ---- 地图行走过场：小人（亲历者头像）从当前地点走到下一个地点 ---- */
    var WALK = {
      dock:      {x:480, y:530, name:'朝天门码头',  img:'assets/images/char-worker.jpg'},
      tunnel:    {x:620, y:420, name:'较场口大隧道', img:'assets/images/char-worker.jpg'},
      newspaper: {x:700, y:380, name:'新华日报社',  img:'assets/images/char-editor.jpg'},
      school:    {x:350, y:180, name:'沙坪坝学校',  img:'assets/images/char-student.jpg'},
      airport:   {x:880, y:580, name:'广阳坝机场',  img:'assets/images/char-pilot.jpg'},
      ciqikou:   {x:180, y:120, name:'磁器口古镇',  img:'assets/images/char-worker.jpg'},
      ending:    {x:560, y:300, name:'终章·天亮了', img:''}
    };
    var WALK_FROM_WHO = {
      dock:'林阿婆', tunnel:'林阿婆', newspaper:'陈先生',
      school:'苏同学', airport:'周太太', ciqikou:'林阿婆'
    };
    var walkOverlay = document.getElementById('walk-overlay');
    var walkDots = document.getElementById('walk-dots');
    var walkPath = document.getElementById('walk-path');
    var walkMover = document.getElementById('walk-mover');
    var walkMoverImg = document.getElementById('walk-mover-img');
    var walkCaption = document.getElementById('walk-caption');
    var SVGNS = 'http://www.w3.org/2000/svg';

    function buildWalkDots(toId) {
      walkDots.innerHTML = '';
      Object.keys(WALK).forEach(function (id) {
        var m = WALK[id];
        var active = (id === toId);
        var g = document.createElementNS(SVGNS, 'g');
        var labelY = m.y + (m.y > 300 ? 38 : -24);
        if (id === 'ending') {
          var star = document.createElementNS(SVGNS, 'polygon');
          var pts = [];
          for (var k = 0; k < 10; k++) {
            var rad = (k % 2 === 0 ? 18 : 8);
            var ang = -Math.PI/2 + k * Math.PI/5;
            pts.push((m.x + rad*Math.cos(ang)).toFixed(1) + ',' + (m.y + rad*Math.sin(ang)).toFixed(1));
          }
          star.setAttribute('points', pts.join(' '));
          star.setAttribute('fill', active ? '#c9962e' : '#b3a98c');
          star.setAttribute('stroke', '#f2e8cf');
          star.setAttribute('stroke-width', '1.5');
          g.appendChild(star);
        } else {
          var clip = document.createElementNS(SVGNS, 'clipPath');
          clip.id = 'wclip-' + id;
          var cc = document.createElementNS(SVGNS, 'circle');
          cc.setAttribute('cx', m.x); cc.setAttribute('cy', m.y); cc.setAttribute('r', 15);
          clip.appendChild(cc);
          var ring = document.createElementNS(SVGNS, 'circle');
          ring.setAttribute('cx', m.x); ring.setAttribute('cy', m.y); ring.setAttribute('r', 15);
          ring.setAttribute('fill', '#f2e8cf');
          ring.setAttribute('stroke', active ? '#8b2e2e' : '#a89878');
          ring.setAttribute('stroke-width', active ? '2.5' : '1.5');
          ring.setAttribute('opacity', active ? '1' : '0.6');
          var img = document.createElementNS(SVGNS, 'image');
          img.setAttribute('href', m.img);
          img.setAttribute('x', m.x - 15); img.setAttribute('y', m.y - 15);
          img.setAttribute('width', 30); img.setAttribute('height', 30);
          img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
          img.setAttribute('clip-path', 'url(#wclip-' + id + ')');
          img.setAttribute('opacity', active ? '1' : '0.45');
          g.appendChild(clip); g.appendChild(ring); g.appendChild(img);
        }
        var label = document.createElementNS(SVGNS, 'text');
        label.setAttribute('x', m.x); label.setAttribute('y', labelY);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-size', '15');
        label.setAttribute('fill', '#3a2f1c');
        label.setAttribute('opacity', active ? '0.95' : '0.6');
        label.textContent = m.name;
        g.appendChild(label);
        walkDots.appendChild(g);
      });
    }

    function playWalk(fromId, toId) {
      var a = WALK[fromId], b = WALK[toId];
      var rel = (toId === 'ending') ? 'pages/ending.html' : 'pages/scenes/' + toId + '.html';
      if (!a || !b) { shellNav(rel); return; }
      buildWalkDots(toId);
      walkCaption.textContent = (WALK_FROM_WHO[fromId] || '') + ' · 从' + a.name + '前往' + b.name;
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      var bend = Math.min(48, len * 0.18);
      var cx = (a.x + b.x)/2 + (-dy/len) * bend;
      var cy = (a.y + b.y)/2 + ( dx/len) * bend;
      walkMoverImg.setAttribute('href', a.img);
      walkMover.setAttribute('transform', 'translate(' + a.x + ',' + a.y + ')');
      walkOverlay.style.display = 'flex';
      requestAnimationFrame(function () { walkOverlay.style.opacity = '1'; });
      function bez(p) {
        return {
          x: (1-p)*(1-p)*a.x + 2*(1-p)*p*cx + p*p*b.x,
          y: (1-p)*(1-p)*a.y + 2*(1-p)*p*cy + p*p*b.y
        };
      }
      var dur = 2400, t0 = null;
      function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min((ts - t0) / dur, 1);
        var e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
        var pt = bez(e);
        walkMover.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
        walkPath.setAttribute('d', 'M' + a.x + ' ' + a.y + ' Q' + cx + ' ' + cy + ' ' + pt.x + ' ' + pt.y);
        if (p < 1) {
          requestAnimationFrame(step);
        } else {
          walkCaption.textContent = '抵达' + b.name + '……';
          setTimeout(function () {
            walkOverlay.style.opacity = '0';
            setTimeout(function () {
              walkOverlay.style.display = 'none';
              shellNav(rel);
            }, 460);
          }, 650);
        }
      }
      requestAnimationFrame(step);
    }

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.__wudu1937 === 'walk' && d.from && d.to) {
        playWalk(d.from, d.to);
      }
    });

    /* ---- 常驻浮动导航 ---- */
    var floatNav = document.getElementById('float-nav');
    function updateFloatNav() {
      var src = stage.getAttribute('src') || '';
      // 首页（地图）不显示
      var isHome = /index\.html?$/.test(src) || src === '' || /#$/.test(src);
      floatNav.hidden = isHome;
    }
    function shellNav(url) {
      stage.src = url;
      if (location.hash !== '#' + url) {
        history.replaceState(null, '', '#' + url);
      }
    }
    document.getElementById('fn-toggle').addEventListener('click', function () {
      floatNav.classList.toggle('open');
    });
    function closeMenu() { floatNav.classList.remove('open'); }
    document.getElementById('fn-home').addEventListener('click', function () {
      closeMenu();
      shellNav('index.html');
    });
    document.getElementById('fn-reselect').addEventListener('click', function () {
      if (window.confirm('确定要重新开始吗？当前探索进度将被清空。')) {
        closeMenu();
        try { localStorage.removeItem('wudu1937_save'); } catch (e) {}
        shellNav('index.html');
      }
    });
    // 切换页面时收起菜单
    document.getElementById('stage').addEventListener('load', closeMenu);
    updateFloatNav();
  })();
  </script>
</body>
</html>
